<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm thử AI video | CameraAI</title><link rel="stylesheet" href="/static/css/style.css"><style>
.test{max-width:1500px;margin:auto;padding:2rem}.head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}.upload{padding:1rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.prompt-preview{width:100%;min-height:120px;background:#0b1220;color:#dbeafe;border:1px solid var(--border-color);border-radius:8px;padding:.7rem;font-family:ui-monospace,monospace}.note{color:var(--text-muted)}.workspace{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:1rem;margin-top:1rem}.panel{background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:1rem;min-width:0;max-height:70vh;overflow-y:auto}.panel h2{font-size:1rem;margin-bottom:.7rem}.panel p{white-space:pre-wrap;line-height:1.5;color:#dbeafe}.status{color:#a5f3fc;margin-bottom:.8rem}.error{color:#fca5a5}.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:8px}.wide{grid-column:1/-1;border-color:rgba(16,185,129,.35);background:rgba(16,185,129,.07)}.hidden{display:none}@media(max-width:1000px){.test{padding:1rem}.workspace{grid-template-columns:1fr}.wide{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}</style></head>
<body><main class="test"><div class="head"><div><h1>Kiểm thử AI từ video</h1><p class="note">Admin upload video mẫu; hệ thống tạo event test riêng, không ảnh hưởng camera thật.</p></div><a class="btn btn-glass" href="/">Về Dashboard</a></div><form id="upload" class="upload"><label>Prompt Cosmos <select id="promptProfile"></select></label><button type="button" class="btn btn-glass" id="savePrompt">Lưu prompt mặc định</button><label>Nạp prompt từ máy <input id="promptFile" type="file" accept="text/plain,.txt"></label><button type="button" class="btn btn-glass" id="uploadPrompt">Tải prompt lên</button><textarea id="promptPreview" class="prompt-preview" readonly placeholder="Chọn một profile để xem nội dung prompt."></textarea><input id="file" type="file" accept="video/mp4,video/quicktime,video/x-matroska,video/x-msvideo,video/webm" required><button class="btn btn-primary">Upload và tạo event test</button><span id="uploadStatus" class="note"></span></form><section id="result" class="workspace hidden"><section class="panel"><h2>Video test</h2><video id="player" class="video" controls></video><p id="eventInfo" class="note"></p></section><section class="panel"><h2>Phân tích hình ảnh</h2><button class="btn btn-primary" id="videoBtn">🎬 Phân tích hình ảnh</button><p id="videoStatus" class="status">Chưa chạy</p><p id="videoSummary">-</p><p id="videoError" class="error"></p></section><section class="panel"><h2>Phân tích âm thanh</h2><button class="btn btn-primary" id="audioBtn">🎙 Phân tích âm thanh + LLM</button><p id="audioStatus" class="status">Chưa chạy</p><p id="transcript">-</p><p id="audioError" class="error"></p></section><section class="panel wide"><h2>🤖 LLM gợi ý</h2><p><strong>Kết luận:</strong> <span id="llmSummary">-</span></p><p><strong>Rủi ro:</strong> <span id="llmRisk">-</span></p><p><strong>Hành động:</strong> <span id="llmAction">-</span></p><p><strong>Evidence:</strong> <span id="llmEvidence">-</span></p></section></section></main><script>
let eventId=null,poll=null;const $=id=>document.getElementById(id);function clipUrl(r){return '/clips/'+r.split('/').map(encodeURIComponent).join('/')}async function previewProfile(){const profile=$('promptProfile').value;if(!profile)return;const r=await fetch(`/api/admin/cosmos/prompt-profiles/${encodeURIComponent(profile)}`);const d=await r.json();$('promptPreview').value=r.ok?d.text:(d.detail||'Không thể tải nội dung prompt.')}async function loadProfiles(selected){const r=await fetch('/api/admin/cosmos/prompt-profile');const d=await r.json();if(!r.ok)return;const active=selected||d.selected;$('promptProfile').innerHTML=d.profiles.map(p=>`<option value="${p}" ${p===active?'selected':''}>${p}</option>`).join('');await previewProfile()}$('promptProfile').onchange=previewProfile;$('savePrompt').onclick=async()=>{const profile=$('promptProfile').value;const r=await fetch('/api/admin/cosmos/prompt-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile})});const d=await r.json();$('uploadStatus').textContent=r.ok?`Đã lưu prompt Cosmos: ${d.selected}`:(d.detail||'Không thể lưu prompt')};$('uploadPrompt').onclick=async()=>{const file=$('promptFile').files[0];if(!file){$('uploadStatus').textContent='Hãy chọn một file .txt trước.';return}const body=new FormData();body.append('prompt_file',file);$('uploadStatus').textContent='Đang tải prompt lên…';const r=await fetch('/api/admin/cosmos/prompt-profiles/upload',{method:'POST',body});const d=await r.json();if(!r.ok){$('uploadStatus').textContent=d.detail||'Không thể tải prompt';return}$('uploadStatus').textContent=`Đã tải ${d.profile}. Bấm Lưu prompt mặc định để áp dụng.`;await loadProfiles(d.profile)};loadProfiles();function render(e){const v=e.video_analysis||{},a=e.audio_analysis||{},s=a.suggestion||{};$('videoStatus').textContent=v.status||'Chưa chạy';$('videoSummary').textContent=v.summary||'-';$('videoError').textContent=v.error_message||'';$('audioStatus').textContent=a.status||'Chưa chạy';$('transcript').textContent=a.transcript||'-';$('audioError').textContent=a.error_message||'';$('llmSummary').textContent=s.summary||'Chưa có kết luận LLM.';$('llmRisk').textContent=s.risk_level||'-';$('llmAction').textContent=s.recommended_action||'-';$('llmEvidence').textContent=(s.evidence||[]).map(x=>`${x.source}: ${x.detail}`).join(' | ')||'-'}async function refresh(){if(!eventId)return;const r=await fetch(`/api/events/${eventId}`);if(r.ok)render(await r.json())}function start(){clearInterval(poll);refresh();poll=setInterval(refresh,1500)}$('upload').addEventListener('submit',async e=>{e.preventDefault();const f=$('file').files[0];if(!f)return;$('uploadStatus').textContent='Đang upload…';const body=new FormData();body.append('video',f);const r=await fetch('/api/admin/test-videos/upload',{method:'POST',body});const d=await r.json();if(!r.ok){$('uploadStatus').textContent=d.detail||'Upload lỗi';return}const ev=d.event;eventId=ev.id;$('player').src=clipUrl(ev.clip_filename);$('eventInfo').textContent=`Event test #${ev.id} · ${ev.description}`;$('result').classList.remove('hidden');$('uploadStatus').textContent='Đã tạo event test.';render(ev)});$('videoBtn').onclick=async()=>{await fetch(`/api/events/${eventId}/video-analysis`,{method:'POST'});start()};$('audioBtn').onclick=async()=>{await fetch(`/api/events/${eventId}/audio-analysis`,{method:'POST'});start()};</script></body></html>
